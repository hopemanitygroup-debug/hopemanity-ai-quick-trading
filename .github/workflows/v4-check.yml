name: V4 paper checks
on:
  push:
    branches: [v4-paper]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python multi_agent_v4.py
      - name: Public market data probe
        run: |
          python - <<'PY'
          from binance_v4_feed import snapshot
          result = snapshot(fee_bps=10, slippage_bps=2)
          print(result)
          assert 'price' in result, result
          PY
